<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d16"><link rel="manifest" href="manifest.json"><title>Mon quotidien</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f3f4f6;font:16px system-ui}main{max-width:650px;margin:auto;padding:24px 16px 110px}h1{font-size:28px;margin:0 0 8px}h2{font-size:20px}p,small{color:#aab6ca}button,input,select{font:inherit;color:inherit;background:#253247;border:1px solid #46546a;border-radius:10px;padding:10px}button{cursor:pointer}button.active,.primary{background:#7452cf;border-color:#a78bfa}section{background:#1c2738;border:1px solid #334155;border-radius:16px;padding:14px;margin:12px 0}.line{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #334155}.line:last-child{border:0}.time{font-size:13px;color:#b8c4d7;min-width:105px}.dot{width:5px;height:30px;border-radius:4px;background:var(--c)}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#182233;padding:8px 3px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #334155}nav button{border:0;background:transparent;font-size:11px;flex:1;max-width:130px;padding:8px 2px}nav span{display:block;font-size:22px;margin-bottom:4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}label{display:block;margin:10px 0 4px;color:#b8c4d7}input[type=text],input[type=date],select{max-width:100%}.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px}.edit input,.edit select{width:100%}.edit .wide{grid-column:1/-1}.warn{color:#fbbf24}.muted{color:#aab6ca}.stat{font-size:26px;font-weight:bold}.chip{display:inline-block;padding:5px 9px;border-radius:8px;background:#303c50;margin:3px;font-size:13px}a{color:#c4b5fd}body{background:radial-gradient(ellipse at top,#211a39 0, #0b0d16 55%);color:#f5f3ff}main{padding-top:32px}h1{font-size:34px;letter-spacing:-1.5px}h2{letter-spacing:-.4px}.eyebrow{letter-spacing:2px;font-size:10px;color:#b49aff}section{background:#171b2a;border-color:#303348;border-radius:22px;padding:18px}button,input,select{background:#222638;border-color:#383b51;border-radius:12px}button.active,.primary{background:linear-gradient(135deg,#8057dd,#5935a9);border-color:#a78bfa}nav{background:#121522ee;backdrop-filter:blur(16px);border-color:#303348}nav button.active{background:#302348;color:#d8c8ff}.hero{background:linear-gradient(125deg,#49307d,#211b3e);border-color:#7152a3}.hero h2{font-size:27px;margin:12px 0}.activity{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:#202436;border:0;margin:8px 0;padding:12px;border-left:3px solid var(--c)}.activityIcon{display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);width:38px;height:38px;border-radius:12px;font-size:20px}.activityText{flex:1;display:grid;gap:4px}.activityText small{font-size:12px}.chip{background:color-mix(in srgb,var(--c) 15%,#171b2a);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}.catrow{display:grid;grid-template-columns:44px minmax(0,1fr) 66px 40px;gap:6px;margin:9px 0}.catrow input,.catrow select{min-width:0;width:100%;padding:7px}.catrow input[type=color]{height:44px}.bar{display:block;height:6px;background:linear-gradient(to right,var(--c) var(--p),#303548 var(--p));border-radius:8px;margin-top:8px}dialog{background:#171b2a;color:#f5f3ff;border:1px solid #484064;border-radius:22px;width:min(92%,420px);padding:22px}dialog::backdrop{background:#000a}dialog input,dialog select{max-width:100%;margin-bottom:12px}dialog .row{margin-top:12px}@media(max-width:420px){main{padding:22px 12px 110px}section{padding:12px}.row button{padding:9px 8px}.activity{padding:10px}.catrow{grid-template-columns:38px minmax(0,1fr) 58px 34px}} </style><main id="app"></main><dialog id="modal"></dialog><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'], cats={Travail:'#94a3b8',Sport:'#60a5fa',Musique:'#c084fc',Chien:'#4ade80',Cuisine:'#fbbf24',Couple:'#f472b6',Trajet:'#94a3b8',Personnel:'#67e8f9',Autre:'#aab6ca'};
const baseCats={...cats};const icons=['◆','●','♫','♥','★','☀','☕','⚡','✦','✓','🏋','🚲','🐾','🍳','💼','🚗'];function migrate(){data.categories=data.categories||Object.fromEntries(Object.entries(baseCats).map(([k,c],i)=>[k,{name:k,color:c,icon:['💼','🏋','♫','🐾','🍳','♥','🚗','☀','◆'][i]}]));for(const day of data.weeks.flat())for(const x of day){if(!Object.hasOwn(data.categories,x.c))data.categories[x.c]={name:x.c,color:'#aab6ca',icon:'◆'};x.n=x.n.replace(/^Composition/,'Musique')}syncCats()}function syncCats(){for(const k of Object.keys(cats))delete cats[k];for(const [k,v] of Object.entries(data.categories))cats[k]=/^#[0-9a-f]{6}$/i.test(v.color)?v.color:'#aab6ca'}function cname(k){return esc(data.categories[k]?.name||k)}function ico(k){return esc(data.categories[k]?.icon||'◆')}function catEditor(){return `<section><h2>Mes catégories</h2><p>Les couleurs s’appliquent à toutes les activités.</p>${Object.keys(cats).map((k,i)=>`<div class="catrow"><input type="color" aria-label="Couleur" value="${cats[k]}" onchange="catChange(${i},'color',this.value)"><input aria-label="Nom" value="${cname(k)}" onchange="catChange(${i},'name',this.value)"><select aria-label="Icône" onchange="catChange(${i},'icon',this.value)">${icons.map(v=>`<option ${v===data.categories[k].icon?'selected':''}>${v}</option>`).join('')}</select><button onclick="catDelete(${i})" aria-label="Supprimer">×</button></div>`).join('')}<button class="primary" onclick="catAdd()">＋ Créer une catégorie</button></section>`}function catChange(i,f,v){let k=Object.keys(cats)[i];if(f==='name'&&!v.trim())return;data.categories[k][f]=v;syncCats();save();render()}function catAdd(){let n=prompt('Nom de la catégorie');if(!n?.trim())return;let k='custom-'+Date.now();data.categories[k]={name:n.trim(),color:'#a78bfa',icon:'◆'};syncCats();save();render()}function catDelete(i){let k=Object.keys(cats)[i],others=Object.keys(cats).filter(x=>x!==k);if(!others.length)return alert('Conserve au moins une catégorie.');let used=data.weeks.flat(2).filter(x=>x.c===k);if(used.length){let v=prompt('Réaffecter '+used.length+' activités :\n'+others.map((x,i)=>`${i+1}. ${data.categories[x].name}`).join('\n'));if(v===null||!others[Number(v)-1])return;used.forEach(x=>x.c=others[Number(v)-1])}else if(!confirm('Supprimer cette catégorie ?'))return;delete data.categories[k];syncCats();save();render()}const a=(s,e,n,c)=>({s,e,n,c});function defaults(){return {weeks:Array.from({length:2},()=>Array.from({length:7},()=>[])),anchor:'',balance:0,goal:468,limit:600,logs:{}}}let data;try{data=JSON.parse(localStorage.getItem('mq-v1'))||defaults()}catch{data=defaults()}migrate();let tab=0,w=0,d=(new Date().getDay()+6)%7;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};const fmt=m=>`${m<0?'−':''}${Math.floor(Math.abs(m)/60)}h${String(Math.abs(m)%60).padStart(2,'0')}`;const sorted=x=>[...x].sort((a,b)=>a.s.localeCompare(b.s));function save(){try{localStorage.setItem('mq-v1',JSON.stringify(data))}catch{alert('Sauvegarde locale indisponible : exporte tes données.')}}function dateStr(){let n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}function autoWeek(){if(!data.anchor)return 0;let now=new Date(dateStr()+'T12:00:00Z'),start=new Date(data.anchor+'T12:00:00Z');return ((Math.floor((now-start)/604800000)%2)+2)%2}w=autoWeek();function go(t){tab=t;render()}function choose(W,D){w=W;d=D;render()}function lines(arr){return sorted(arr).map(x=>`<button class="activity" onclick="editOne(${arr.indexOf(x)})" style="--c:${cats[x.c]||'#aab6ca'}"><span class="activityIcon">${ico(x.c)}</span><span class="activityText"><b>${esc(x.n)}</b><small>${esc(x.s)} – ${esc(x.e)} · ${fmt(mins(x.e)-mins(x.s))}</small></span><span>›</span></button>`).join('')}function editOne(i){let x=data.weeks[w][d][i];$('modal').innerHTML=`<h2>Modifier l’activité</h2><label>Intitulé</label><input id="en" value="${esc(x.n)}"><label>Début / fin</label><div class="row"><input id="es" type="time" value="${esc(x.s)}"><input id="ee" type="time" value="${esc(x.e)}"></div><label>Catégorie</label><select id="ec">${Object.keys(cats).map(k=>`<option value="${esc(k)}" ${k===x.c?'selected':''}>${cname(k)}</option>`).join('')}</select><div class="row"><button class="primary" onclick="commitOne(${i})">Enregistrer</button><button onclick="$('modal').close()">Annuler</button><button onclick="$('modal').close();removeItem(${i})">Supprimer</button></div>`;$('modal').showModal()}function commitOne(i){let n=$('en').value.trim(),s=$('es').value,e=$('ee').value,c=$('ec').value;if(!n||!s||!e||e<=s)return alert('Vérifie les horaires et le nom.');Object.assign(data.weeks[w][d][i],{n,s,e,c});save();$('modal').close();render()}function nextCard(arr){if(w!==autoWeek()||d!==(new Date().getDay()+6)%7)return '';let now=new Date(),m=now.getHours()*60+now.getMinutes(),x=sorted(arr).find(x=>mins(x.e)>m);return `<section class="hero"><small>${x?(mins(x.s)<=m?'EN COURS':'PROCHAINE ACTIVITÉ'):'JOURNÉE TERMINÉE'}</small><h2>${x?ico(x.c)+' '+esc(x.n):'Bonne soirée !'}</h2>${x?esc(x.s)+' – '+esc(x.e):''}</section>`}function total(arr,c){return arr.filter(x=>x.c===c).reduce((s,x)=>s+Math.max(0,mins(x.e)-mins(x.s)),0)}function warnings(arr){let s=sorted(arr),out=[];s.forEach((x,i)=>{if(mins(x.e)<=mins(x.s))out.push('Durée invalide : '+x.n);if(s.slice(0,i).some(y=>y.e>x.s))out.push('Chevauchement : '+x.n)});let dogs=s.filter(x=>x.c==='Chien');if(!dogs.some(x=>x.s<='18:00'))out.push('Promenade avant 18h à prévoir.');if(!dogs.some(x=>x.s>='20:30'))out.push('Dernière promenade à prévoir.');return out}function selectors(){return `<div class="row">${[0,1].map(i=>`<button class="${w===i?'active':''}" onclick="choose(${i},${d})">Semaine ${i?'B · cours':'A'}</button>`).join('')}</div><div class="row" style="margin-top:10px">${days.map((x,i)=>`<button class="${d===i?'active':''}" onclick="choose(${w},${i})">${x.slice(0,3)}</button>`).join('')}</div>`}function render(){let arr=data.weeks[w][d], html='<small class="eyebrow">TON ESPACE PERSONNEL · V2.0</small><h1>Mon quotidien</h1>';if(tab===0){html+=`<p>${days[d]} · Semaine ${w?'B':'A'}</p>${selectors()}${nextCard(arr)}<section><h2>Programme du jour</h2>${lines(arr)}</section>${arr.length?'':'<p>Pour commencer, importe ton planning dans Réglages.</p>'}<button onclick="go(2)">Modifier cette journée</button>`}if(tab===1){html+=selectors()+data.weeks[w].map((x,i)=>`<section onclick="choose(${w},${i});go(0)"><h2>${days[i]}</h2>${sorted(x).map(y=>`<span class="chip" style="--c:${cats[y.c]||'#aab6ca'}">${ico(y.c)} ${esc(y.s)} ${esc(y.n)}</span>`).join('')}</section>`).join('')}if(tab===2){html+=selectors()+`<p>Les modifications s'appliquent à cette journée du cycle.</p>`+arr.map((x,i)=>`<section class="edit"><input class="wide" aria-label="Activité" type="text" value="${esc(x.n)}" onchange="change(${i},'n',this.value)"><input aria-label="Début" type="time" value="${esc(x.s)}" onchange="change(${i},'s',this.value)"><input aria-label="Fin" type="time" value="${esc(x.e)}" onchange="change(${i},'e',this.value)"><select aria-label="Catégorie" onchange="change(${i},'c',this.value)">${Object.keys(cats).map(c=>`<option value="${esc(c)}" ${c===x.c?'selected':''}>${cname(c)}</option>`).join('')}</select><button onclick="removeItem(${i})">Supprimer</button></section>`).join('')+`<button class="primary" onclick="addItem()">＋ Ajouter une activité</button>`}if(tab===3){let all=data.weeks[w].flat(),planned=total(all,'Travail')-5*data.goal,actual=data.balance+Object.values(data.logs).reduce((s,x)=>s+x-data.goal,0);html+=selectors()+`<section><h2>Temps prévu cette semaine</h2>${Object.keys(cats).map(c=>`<div class="line"><span style="flex:1;color:${cats[c]}">${ico(c)} ${cname(c)}<span class="bar" style="--c:${cats[c]};--p:${Math.min(100,total(all,c)/Math.max(1,...Object.keys(cats).map(k=>total(all,k)))*100)}%"></span></span><b>${fmt(total(all,c))}</b></div>`).join('')}<p>Écart travail prévu : ${fmt(planned)}</p></section><section><h2>Compteur réel</h2><div class="stat">${fmt(actual)}</div>${Math.abs(actual)>=data.limit?'<p class="warn">Limite atteinte ou dépassée.</p>':''}<p>Solde initial + journées réellement saisies.</p><label>Date travaillée</label><input id="logdate" type="date" value="${dateStr()}"><label>Minutes travaillées (8h = 480)</label><input id="logmin" type="number" min="0" max="1440" value="${data.goal}"><button onclick="logDay()">Enregistrer</button>${Object.entries(data.logs).sort().map(([k,v])=>`<div class="line">${esc(k)} · ${fmt(v)} <button onclick="deleteLog('${esc(k)}')">Retirer</button></div>`).join('')}</section>`}if(tab===4){html+=catEditor()+`<section><h2>Cycle et travail</h2><label>Lundi de référence de la semaine A</label><input type="date" value="${esc(data.anchor)}" onchange="setting('anchor',this.value)"><p>Choisis un lundi sans cours pour activer la sélection automatique du cycle.</p><label>Solde initial (minutes, négatif possible)</label><input type="number" value="${data.balance}" onchange="setting('balance',Number(this.value))"><label>Objectif quotidien (minutes)</label><input type="number" min="1" value="${data.goal}" onchange="setting('goal',Number(this.value))"><label>Limite du compteur (minutes)</label><input type="number" min="1" value="${data.limit}" onchange="setting('limit',Number(this.value))"></section><section><h2>Sauvegarde</h2><p>Les données restent dans ce navigateur. Exporte une copie régulièrement.</p><button onclick="exportData()">Exporter JSON</button><label>Importer une sauvegarde</label><input type="file" accept="application/json,.json" onchange="importData(this)"><p><button onclick="resetData()">Réinitialiser</button></p></section><section><h2>Installation Android</h2><p>Depuis une adresse HTTPS, ouvre Chrome puis le menu ⋮ et Installer l’application ou Ajouter à l’écran d’accueil.</p></section>`}if(tab===0||tab===2){html+=warnings(arr).map(x=>`<p class="warn">⚠ ${esc(x)}</p>`).join('')}$('app').innerHTML=html;$('nav').innerHTML=['⌂|Accueil','▦|Planning','✎|Modifier','▥|Stats','⚙|Réglages'].map((x,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})"><span>${x.split('|')[0]}</span>${x.split('|')[1]}</button>`).join('')}function change(i,k,v){data.weeks[w][d][i][k]=v;save();render()}function removeItem(i){if(confirm('Supprimer cette activité ?')){data.weeks[w][d].splice(i,1);save();render()}}function addItem(){data.weeks[w][d].push(a('18:00','19:00','Nouvelle activité',Object.keys(cats)[0]));save();render();window.scrollTo(0,document.body.scrollHeight)}function setting(k,v){if((k==='goal'||k==='limit')&&!(v>0))return;if(k==='anchor'&&v&&new Date(v+'T12:00:00').getDay()!==1){alert('Choisis un lundi.');render();return}data[k]=v;save();render()}function logDay(){let k=$('logdate').value,v=Number($('logmin').value);if(!k||!Number.isInteger(v)||v<0||v>1440)return;data.logs[k]=v;save();render()}function deleteLog(k){delete data.logs[k];save();render()}function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='mon-quotidien-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.weeks)||x.weeks.length!==2||!x.weeks.every(y=>Array.isArray(y)&&y.length===7&&y.every(z=>Array.isArray(z)&&z.every(a=>['s','e','n','c'].every(k=>typeof a[k]==='string')&&/^([01]\d|2[0-3]):[0-5]\d$/.test(a.s)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(a.e))))||!Number.isFinite(x.balance)||!(x.goal>0)||!(x.limit>0)||!x.logs||!Object.entries(x.logs).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isFinite(v)))throw Error();data=x;migrate();save();w=autoWeek();render()}catch{alert('Sauvegarde invalide.')}}function resetData(){if(confirm('Effacer toutes les modifications ?')){data=defaults();migrate();save();render()}}save();render();setInterval(()=>{if(tab===0&&!$('modal').open)render()},60000);if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>

<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d16"><link rel="manifest" href="manifest.json"><title>Mon quotidien</title><style>

alog><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'], cats={Travail:'#94a3b8',Sport:'#60a5fa',Musique:'#c084fc',Chien:'#4ade80',Cuisine:'#fbbf24',Couple:'#f472b6',Trajet:'#94a3b8',Personnel:'#67e8f9',Autre:'#aab6ca'};
const baseCats={...cats};const icons=['◆','●','♫','♥','★','☀','☕','⚡','✦','✓','🏋','🚲','🐾','🍳','💼','🚗','🎸','🎹','🎧','🎤','🥁','🎬','🎨','📈','💰','📊','💻','📚','🇬🇧','🏃','🚴','🏊','🥊','🧘','🩺','💊','🏠','🐕','🛒','🚿','🛏️','❤️','📺','🎮','✈️','🏝️','🎁','🎉','🎂','📅','⏳','☀️','🍎','🍽️','📝','🎯','🔔','🏦','🛠️'];function migrate(){data.categories=data.categories||Object.fromEntries(Object.entries(baseCats).map(([k,c],i)=>[k,{name:k,color:c,icon:['💼','🏋','♫','🐾','🍳','♥','🚗','☀','◆'][i]}]));for(const day of data.weeks.flat())for(const x of day){if(!Object.hasOwn(data.categories,x.c))data.categories[x.c]={name:x.c,color:'#aab6ca',icon:'◆'};x.n=x.n.replace(/^Composition/,'Musique')}data.anchor=data.anchor||'2026-11-30';data.agenda=data.agenda||{};data.events=data.events||[];data.tasks=data.tasks||[];data.models=data.models||[];data.overrides=data.overrides||{};data.filters=data.filters||null;data.history=data.history||{};syncCats()}function syncCats(){for(const k of Object.keys(cats))delete cats[k];for(const [k,v] of Object.entries(data.categories))cats[k]=/^#[0-9a-f]{6}$/i.test(v.color)?v.color:'#aab6ca'}function cname(k){return esc(data.categories[k]?.name||k)}function ico(k){return esc(data.categories[k]?.icon||'◆')}function catEditor(){return `<section><h2>Mes catégories</h2><p>Les couleurs s’appliquent à toutes les activités.</p>${Object.keys(cats).map((k,i)=>`<div class="catrow"><input type="color" aria-label="Couleur" value="${cats[k]}" onchange="catChange(${i},'color',this.value)"><input aria-label="Nom" value="${cname(k)}" onchange="catChange(${i},'name',this.value)"><select aria-label="Icône" onchange="catChange(${i},'icon',this.value)">${icons.map(v=>`<option ${v===data.categories[k].icon?'selected':''}>${v}</option>`).join('')}</select><button onclick="catDelete(${i})" aria-label="Supprimer">×</button></div>`).join('')}<button class="primary" onclick="catAdd()">＋ Créer une catégorie</button></section>`}function catChange(i,f,v){let k=Object.keys(cats)[i];if(f==='name'&&!v.trim())return;data.categories[k][f]=v;syncCats();save();render()}function catAdd(){let n=prompt('Nom de la catégorie');if(!n?.trim())return;let k='custom-'+Date.now();data.categories[k]={name:n.trim(),color:'#a78bfa',icon:'◆'};syncCats();save();render()}function catDelete(i){let k=Object.keys(cats)[i],others=Object.keys(cats).filter(x=>x!==k);if(!others.length)return alert('Conserve au moins une catégorie.');let used=data.weeks.flat(2).filter(x=>x.c===k);if(used.length){let v=prompt('Réaffecter '+used.length+' activités :\n'+others.map((x,i)=>`${i+1}. ${data.categories[x].name}`).join('\n'));if(v===null||!others[Number(v)-1])return;used.forEach(x=>x.c=others[Number(v)-1])}else if(!confirm('Supprimer cette catégorie ?'))return;delete data.categories[k];syncCats();save();render()}const a=(s,e,n,c)=>({s,e,n,c});function defaults(){return {weeks:Array.from({length:2},()=>Array.from({length:7},()=>[])),anchor:'',balance:0,goal:468,limit:600,logs:{}}}let data;try{data=JSON.parse(localStorage.getItem('mq-v1'))||defaults()}catch{data=defaults()}migrate();let tab=0,w=0,d=(new Date().getDay()+6)%7;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};const fmt=m=>`${m<0?'−':''}${Math.floor(Math.abs(m)/60)}h${String(Math.abs(m)%60).padStart(2,'0')}`;const sorted=x=>[...x].sort((a,b)=>a.s.localeCompare(b.s));function save(){try{localStorage.setItem('mq-v1',JSON.stringify(data))}catch{alert('Sauvegarde locale indisponible : exporte tes données.')}}function dateStr(){let n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}function autoWeek(){if(!data.anchor)return 0;let now=new Date(dateStr()+'T12:00:00Z'),start=new Date(data.anchor+'T12:00:00Z');return ((Math.floor((now-start)/604800000)%2)+2)%2}w=autoWeek();function go(t){tab=t;render()}function choose(W,D){w=W;d=D;render()}function lines(arr){return sorted(arr).map(x=>`<button class="activity" onclick="editOne(${arr.indexOf(x)})" style="--c:${cats[x.c]||'#aab6ca'}"><span class="activityIcon">${ico(x.c)}</span><span class="activityText"><b>${esc(x.n)}</b><small>${esc(x.s)} – ${esc(x.e)} · ${fmt(mins(x.e)-mins(x.s))}</small></span><span>›</span></button>`).join('')}function editOne(i){let x=data.weeks[w][d][i];$('modal').innerHTML=`<h2>Modifier l’activité</h2><label>Intitulé</label><input id="en" value="${esc(x.n)}"><label>Début / fin</label><div class="row"><input id="es" type="time" value="${esc(x.s)}"><input id="ee" type="time" value="${esc(x.e)}"></div><label>Catégorie</label><select id="ec">${Object.keys(cats).map(k=>`<option value="${esc(k)}" ${k===x.c?'selected':''}>${cname(k)}</option>`).join('')}</select><div class="row"><button class="primary" onclick="commitOne(${i})">Enregistrer</button><button onclick="$('modal').close()">Annuler</button><button onclick="$('modal').close();removeItem(${i})">Supprimer</button></div>`;$('modal').showModal()}function commitOne(i){let n=$('en').value.trim(),s=$('es').value,e=$('ee').value,c=$('ec').value;if(!n||!s||!e||e<=s)return alert('Vérifie les horaires et le nom.');Object.assign(data.weeks[w][d][i],{n,s,e,c});save();$('modal').close();render()}function nextCard(arr){if(w!==autoWeek()||d!==(new Date().getDay()+6)%7)return '';let now=new Date(),m=now.getHours()*60+now.getMinutes(),x=sorted(arr).find(x=>mins(x.e)>m);return `<section class="hero"><small>${x?(mins(x.s)<=m?'EN COURS':'PROCHAINE ACTIVITÉ'):'JOURNÉE TERMINÉE'}</small><h2>${x?ico(x.c)+' '+esc(x.n):'Bonne soirée !'}</h2>${x?esc(x.s)+' – '+esc(x.e):''}</section>`}function total(arr,c){return arr.filter(x=>x.c===c).reduce((s,x)=>s+Math.max(0,mins(x.e)-mins(x.s)),0)}function warnings(arr){let s=sorted(arr),out=[];s.forEach((x,i)=>{if(mins(x.e)<=mins(x.s))out.push('Durée invalide : '+x.n);if(s.slice(0,i).some(y=>y.e>x.s))out.push('Chevauchement : '+x.n)});let dogs=s.filter(x=>x.c==='Chien');if(!dogs.some(x=>x.s<='18:00'))out.push('Promenade avant 18h à prévoir.');if(!dogs.some(x=>x.s>='20:30'))out.push('Dernière promenade à prévoir.');return out}function selectors(){return `<div class="row">${[0,1].map(i=>`<button class="${w===i?'active':''}" onclick="choose(${i},${d})">Semaine ${i?'B · cours':'A'}</button>`).join('')}</div><div class="row" style="margin-top:10px">${days.map((x,i)=>`<button class="${d===i?'active':''}" onclick="choose(${w},${i})">${x.slice(0,3)}</button>`).join('')}</div>`}function render(){let arr=data.weeks[w][d], html='<small class="eyebrow">TON ESPACE PERSONNEL · V2.2</small><h1>Mon quotidien</h1>';if(tab===0){html+=`<p>${days[d]} · Semaine ${w?'B':'A'}</p>${selectors()}${nextCard(arr)}<section><h2>Programme du jour</h2>${lines(arr)}</section>${arr.length?'':'<p>Pour commencer, importe ton planning dans Réglages.</p>'}<button onclick="go(2)">Modifier cette journée</button>`}if(tab===1){html+=selectors()+data.weeks[w].map((x,i)=>`<section onclick="choose(${w},${i});go(0)"><h2>${days[i]}</h2>${sorted(x).map(y=>`<span class="chip" style="--c:${cats[y.c]||'#aab6ca'}">${ico(y.c)} ${esc(y.s)} ${esc(y.n)}</span>`).join('')}</section>`).join('')}if(tab===2){html+=selectors()+`<p>Les modifications s'appliquent à cette journée du cycle.</p>`+arr.map((x,i)=>`<section class="edit"><input class="wide" aria-label="Activité" type="text" value="${esc(x.n)}" onchange="change(${i},'n',this.value)"><input aria-label="Début" type="time" value="${esc(x.s)}" onchange="change(${i},'s',this.value)"><input aria-label="Fin" type="time" value="${esc(x.e)}" onchange="change(${i},'e',this.value)"><select aria-label="Catégorie" onchange="change(${i},'c',this.value)">${Object.keys(cats).map(c=>`<option value="${esc(c)}" ${c===x.c?'selected':''}>${cname(c)}</option>`).join('')}</select><button onclick="removeItem(${i})">Supprimer</button></section>`).join('')+`<button class="primary" onclick="addItem()">＋ Ajouter une activité</button>`}if(tab===3){let all=data.weeks[w].flat(),planned=total(all,'Travail')-5*data.goal,actual=data.balance+Object.values(data.logs).reduce((s,x)=>s+x-data.goal,0);html+=selectors()+`<section><h2>Temps prévu cette semaine</h2>${Object.keys(cats).map(c=>`<div class="line"><span style="flex:1;color:${cats[c]}">${ico(c)} ${cname(c)}<span class="bar" style="--c:${cats[c]};--p:${Math.min(100,total(all,c)/Math.max(1,...Object.keys(cats).map(k=>total(all,k)))*100)}%"></span></span><b>${fmt(total(all,c))}</b></div>`).join('')}<p>Écart travail prévu : ${fmt(planned)}</p></section><section><h2>Compteur réel</h2><div class="stat">${fmt(actual)}</div>${Math.abs(actual)>=data.limit?'<p class="warn">Limite atteinte ou dépassée.</p>':''}<p>Solde initial + journées réellement saisies.</p><label>Date travaillée</label><input id="logdate" type="date" value="${dateStr()}"><label>Minutes travaillées (8h = 480)</label><input id="logmin" type="number" min="0" max="1440" value="${data.goal}"><button onclick="logDay()">Enregistrer</button>${Object.entries(data.logs).sort().map(([k,v])=>`<div class="line">${esc(k)} · ${fmt(v)} <button onclick="deleteLog('${esc(k)}')">Retirer</button></div>`).join('')}</section>`}if(tab===4){html+=catEditor()+`<section><h2>Cycle et travail</h2><label>Lundi de référence de la semaine A</label><input type="date" value="${esc(data.anchor)}" onchange="setting('anchor',this.value)"><p>Choisis un lundi sans cours pour activer la sélection automatique du cycle.</p><label>Solde initial (minutes, négatif possible)</label><input type="number" value="${data.balance}" onchange="setting('balance',Number(this.value))"><label>Objectif quotidien (minutes)</label><input type="number" min="1" value="${data.goal}" onchange="setting('goal',Number(this.value))"><label>Limite du compteur (minutes)</label><input type="number" min="1" value="${data.limit}" onchange="setting('limit',Number(this.value))"></section><section><h2>Sauvegarde</h2><p>Les données restent dans ce navigateur. Exporte une copie régulièrement.</p><button onclick="exportData()">Exporter JSON</button><label>Importer une sauvegarde</label><input type="file" accept="application/json,.json" onchange="importData(this)"><p><button onclick="resetData()">Réinitialiser</button></p></section><section><h2>Installation Android</h2><p>Depuis une adresse HTTPS, ouvre Chrome puis le menu ⋮ et Installer l’application ou Ajouter à l’écran d’accueil.</p></section>`}if(tab===0||tab===2){html+=warnings(arr).map(x=>`<p class="warn">⚠ ${esc(x)}</p>`).join('')}$('app').innerHTML=html;$('nav').innerHTML=['⌂|Accueil','▦|Planning','✎|Modifier','▥|Stats','⚙|Réglages'].map((x,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})"><span>${x.split('|')[0]}</span>${x.split('|')[1]}</button>`).join('')}function change(i,k,v){data.weeks[w][d][i][k]=v;save();render()}function removeItem(i){if(confirm('Supprimer cette activité ?')){data.weeks[w][d].splice(i,1);save();render()}}function addItem(){data.weeks[w][d].push(a('18:00','19:00','Nouvelle activité',Object.keys(cats)[0]));save();render();window.scrollTo(0,document.body.scrollHeight)}function setting(k,v){if((k==='goal'||k==='limit')&&!(v>0))return;if(k==='anchor'&&v&&new Date(v+'T12:00:00').getDay()!==1){alert('Choisis un lundi.');render();return}data[k]=v;save();render()}function logDay(){let k=$('logdate').value,v=Number($('logmin').value);if(!k||!Number.isInteger(v)||v<0||v>1440)return;data.logs[k]=v;save();render()}function deleteLog(k){delete data.logs[k];save();render()}function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='mon-quotidien-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.weeks)||x.weeks.length!==2||!x.weeks.every(y=>Array.isArray(y)&&y.length===7&&y.every(z=>Array.isArray(z)&&z.every(a=>['s','e','n','c'].every(k=>typeof a[k]==='string')&&/^([01]\d|2[0-3]):[0-5]\d$/.test(a.s)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(a.e))))||!Number.isFinite(x.balance)||!(x.goal>0)||!(x.limit>0)||!x.logs||!Object.entries(x.logs).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isFinite(v)))throw Error();data=x;migrate();save();w=autoWeek();render()}catch{alert('Sauvegarde invalide.')}}function resetData(){if(confirm('Effacer toutes les modifications ?')){data=defaults();migrate();save();render()}}
const oldRender=render, oldGo=go, oldChoose=choose;
let selected=dateStr(), month=selected.slice(0,7), period='year', detailed=false, actualView=true;
const clone=x=>JSON.parse(JSON.stringify(x)), dayDate=k=>new Date(k+'T12:00:00Z'), iso=n=>n.toISOString().slice(0,10), shift=(k,n)=>iso(new Date(dayDate(k).getTime()+n*86400000)), monday=k=>shift(k,-((dayDate(k).getUTCDay()+6)%7)), dayIndex=k=>(dayDate(k).getUTCDay()+6)%7;
function cycle(k){let m=monday(k);return data.overrides[m]??((Math.floor((dayDate(m)-dayDate(data.anchor))/604800000)%2+2)%2)}
autoWeek=()=>cycle(dateStr());w=autoWeek();
function holidays(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1, eas=iso(new Date(Date.UTC(y,mo-1,da)));return Object.fromEntries([...Object.entries({'01-01':'Jour de l’an','05-01':'Fête du Travail','05-08':'Victoire 1945','07-14':'Fête nationale','08-15':'Assomption','11-01':'Toussaint','11-11':'Armistice','12-25':'Noël'}).map(([k,v])=>[y+'-'+k,v]),[shift(eas,1),'Lundi de Pâques'],[shift(eas,39),'Ascension'],[shift(eas,50),'Lundi de Pentecôte']])}
const statuses=['Travail','Repos','Congé','RTT','Férié'], sc=['#94a3b8','#60a5fa','#4ade80','#c084fc','#fbbf24'];
function holiday(k){return holidays(+k.slice(0,4))[k]||''}function entry(k){return data.agenda[k]||{}}function status(k){return entry(k).status|| (holiday(k)?'Férié':dayIndex(k)>4?'Repos':'Travail')}
function plan(k){let en=entry(k);return en.plan||data.weeks[cycle(k)][dayIndex(k)].filter(x=>status(k)==='Travail'||x.c!=='Travail')}
function setEntry(k,f,v){data.agenda[k]={...entry(k),[f]:v};if(f==='status'&&v!=='Travail'){data.agenda[k].am=false;data.agenda[k].pm=false}save();render()}
function setCycle(v,all){if(all){data.anchor=shift(monday(selected),v?-7:0);for(let k of Object.keys(data.overrides))if(k>=monday(selected))delete data.overrides[k]}else data.overrides[monday(selected)]=v;w=cycle(selected);save();render()}
function cycleUI(){return `<section><h2>Cycle · semaine ${cycle(selected)?'B':'A'}</h2><div class="row"><button onclick="setCycle(0,false)">A cette semaine</button><button onclick="setCycle(1,false)">B cette semaine</button><button onclick="setCycle(0,true)">Recaler en A</button><button onclick="setCycle(1,true)">Recaler en B</button></div><button onclick="delete data.overrides[monday(selected)];save();render()">Cycle automatique</button></section>`}
function datePick(k){selected=k;month=k.slice(0,7);w=cycle(k);d=dayIndex(k);render()}
function dateUI(){return `<div class="row"><button onclick="datePick(shift(selected,-1))">‹</button><input type="date" value="${selected}" onchange="datePick(this.value)"><button onclick="datePick(shift(selected,1))">›</button><button onclick="datePick(dateStr())">Aujourd’hui</button></div>`}
function eventDates(ev,k){return ev.kind==='birthday'?ev.date.slice(-5)===k.slice(-5):ev.date===k}
function eventList(k){return data.events.map((ev,i)=>eventDates(ev,k)?`<div class="line"><span style="flex:1">${ev.kind==='birthday'?'🎂':'📅'} ${esc(ev.name)} <small>${esc(ev.start||'')} ${esc(ev.end||'')} ${esc(ev.place||'')}</small></span><button onclick="eventEdit(${i})">✎</button></div>`:'').join('')}
function eventEdit(i=-1){let ev=data.events[i]||{kind:'rdv',date:selected,name:'',start:'',end:'',reminder:'none'};$('modal').innerHTML=`<h2>Événement</h2><label>Type</label><select id="ek"><option value="rdv" ${ev.kind==='rdv'?'selected':''}>Rendez-vous</option><option value="birthday" ${ev.kind==='birthday'?'selected':''}>Anniversaire annuel</option></select><label>Nom</label><input id="ename" value="${esc(ev.name)}"><label>Date (pour un anniversaire, année 2000 si inconnue)</label><input id="edate" type="date" value="${esc(ev.date)}"><label>Année de naissance facultative</label><input id="eyear" type="number" value="${esc(ev.year||'')}"><label>Horaires facultatifs</label><input id="estart" type="time" value="${esc(ev.start||'')}"><input id="eend" type="time" value="${esc(ev.end||'')}"><label>Lieu / notes</label><input id="eplace" value="${esc(ev.place||'')}"><label>Rappel interne</label>${reminderSelect(ev.reminder)}<div class="row"><button class="primary" onclick="eventSave(${i})">Enregistrer</button><button onclick="$('modal').close()">Annuler</button>${i>=0?`<button onclick="data.events.splice(${i},1);save();$('modal').close();render()">Supprimer</button>`:''}</div>`;$('modal').showModal()}
function reminderSelect(v){return `<select id="reminder">${[['none','Aucun'],['0','Le jour même / au début'],['15','15 min avant'],['60','1 h avant'],['1440','La veille'],['10080','7 jours avant'],['20160','14 jours avant']].map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${n}</option>`).join('')}</select>`}
function eventSave(i){let ev={kind:$('ek').value,name:$('ename').value.trim(),date:$('edate').value,year:$('eyear').value,start:$('estart').value,end:$('eend').value,place:$('eplace').value,reminder:$('reminder').value};if(!ev.name||!ev.date||ev.start&&ev.end&&ev.end<=ev.start)return alert('Vérifie le nom, la date et les horaires.');if(i<0)data.events.push(ev);else data.events[i]=ev;save();$('modal').close();render()}
function taskEdit(i=-1){let t=data.tasks[i]||{};$('modal').innerHTML=`<h2>Tâche</h2><label>Intitulé</label><input id="tn" value="${esc(t.name||'')}"><label>Échéance facultative</label><input id="td" type="date" value="${esc(t.date||'')}"><label>Priorité</label><select id="tp"><option ${t.priority==='Normale'?'selected':''}>Normale</option><option ${t.priority==='Haute'?'selected':''}>Haute</option></select><label>Rappel interne</label>${reminderSelect(t.reminder)}<div class="row"><button onclick="taskSave(${i})">Enregistrer</button><button onclick="$('modal').close()">Annuler</button>${i>=0?`<button onclick="data.tasks.splice(${i},1);save();$('modal').close();render()">Supprimer</button>`:''}</div>`;$('modal').showModal()}
function taskSave(i){let t={name:$('tn').value.trim(),date:$('td').value,priority:$('tp').value,reminder:$('reminder').value,done:data.tasks[i]?.done||false};if(!t.name)return;if(i<0)data.tasks.push(t);else data.tasks[i]=t;save();$('modal').close();render()}
function tasksUI(){return `<section><h2>Mes tâches</h2>${data.tasks.map((t,i)=>`<div class="line"><input type="checkbox" ${t.done?'checked':''} onchange="data.tasks[${i}].done=this.checked;save();render()"><span style="flex:1;${t.done?'text-decoration:line-through':''}">${esc(t.name)} <small>${esc(t.date||'')} · ${esc(t.priority)}</small></span><button onclick="taskEdit(${i})">✎</button></div>`).join('')}<button onclick="taskEdit()">＋ Tâche</button></section>`}
function modelSave(){let n=prompt('Nom du modèle');if(!n?.trim())return;data.models.push({name:n.trim(),plan:clone(plan(selected))});save();render()}
function modelApply(i){if(confirm('Remplacer le programme de cette date uniquement ?'))setEntry(selected,'plan',clone(data.models[i].plan))}
function modelsUI(){return `<section><h2>Modèles de journées</h2><button onclick="modelSave()">Enregistrer cette journée</button>${data.models.map((m,i)=>`<div class="line"><span style="flex:1">${esc(m.name)}</span><button onclick="modelApply(${i})">Appliquer</button><button onclick="if(confirm('Supprimer ce modèle ?')){data.models.splice(${i},1);save();render()}">×</button></div>`).join('')}</section>`}
function realEdit(i){let x=plan(selected)[i]||{n:'',s:'18:00',e:'19:00',c:Object.keys(cats)[0]};$('modal').innerHTML=`<h2>Activité de cette date</h2><label>Nom</label><input id="rn" value="${esc(x.n)}"><label>Horaires</label><input id="rs" type="time" value="${esc(x.s)}"><input id="re" type="time" value="${esc(x.e)}"><label>Catégorie</label><select id="rc">${Object.keys(cats).map(k=>`<option value="${esc(k)}" ${k===x.c?'selected':''}>${cname(k)}</option>`).join('')}</select><label>Rappel interne</label>${reminderSelect(x.reminder)}<div class="row"><button onclick="realSave(${i})">Enregistrer</button><button onclick="$('modal').close()">Annuler</button>${i>=0?`<button onclick="realRemove(${i})">Supprimer</button>`:''}</div>`;$('modal').showModal()}
function realSave(i){let arr=clone(plan(selected)),x={n:$('rn').value.trim(),s:$('rs').value,e:$('re').value,c:$('rc').value,reminder:$('reminder').value};if(!x.n||!x.s||!x.e||x.e<=x.s)return alert('Vérifie les horaires.');if(arr.some((a,j)=>j!==i&&a.s<x.e&&a.e>x.s)&&!confirm('Cette activité chevauche une autre activité. Enregistrer quand même ?'))return;if(i<0)arr.push(x);else arr[i]=x;$('modal').close();setEntry(selected,'plan',arr)}function realRemove(i){if(confirm('Supprimer pour cette date ?')){let arr=clone(plan(selected));arr.splice(i,1);$('modal').close();setEntry(selected,'plan',arr)}}
function realLines(k){let arr=plan(k);return sorted(arr).map(x=>`<button class="activity" style="--c:${cats[x.c]||'#aab6ca'}" onclick="selected='${k}';realEdit(${arr.indexOf(x)})"><span class="activityIcon">${ico(x.c)}</span><span class="activityText"><b>${esc(x.n)}</b><small>${esc(x.s)} – ${esc(x.e)}</small></span>›</button>`).join('')}
const styles22={'Travail':['💼','#94a3b8'],'Repos':['☕','#60a5fa'],'Congé':['🌴','#4ade80'],'RTT':['🏖️','#22d3ee'],'Férié':['📅','#fbbf24'],'Plages fixes':['🕒','#c084fc'],'rdv':['📌','#60a5fa'],'birthday':['🎂','#f472b6'],'task':['📋','#fb923c']};
function recap(){let now=dateStr(),end=shift(now,13),out=[];let add=(k,t,n,h='')=>out.push({k,t,n,h});for(let k=now;k<=end;k=shift(k,1)){for(let ev of data.events)if(eventDates(ev,k))add(k,ev.kind,ev.name,ev.start||'');if(['Congé','RTT','Férié'].includes(status(k)))add(k,status(k),holiday(k)||status(k));if(status(k)==='Travail'){if(entry(k).am)add(k,'Plages fixes','Plage fixe – Matin','10:00 – 11:30');if(entry(k).pm)add(k,'Plages fixes','Plage fixe – Après-midi','14:30 – 15:30')}}for(let t of data.tasks)if(!t.done&&t.date&&t.date<=end)add(t.date,'task',t.name);return out.length?`<section><h2>À venir · 14 jours</h2>${out.sort((a,b)=>(a.k+a.h).localeCompare(b.k+b.h)).map(x=>`<div class="line" style="border-left:3px solid ${styles22[x.t]?.[1]||'#aaa'};padding-left:10px"><span>${styles22[x.t]?.[0]||'📅'} <b>${esc(x.n)}</b><br><small>${dayDate(x.k).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})} ${esc(x.h)}</small></span></div>`).join('')}</section>`:''}
function agendaUI(){let first=month+'-01',n=new Date(Date.UTC(+month.slice(0,4),+month.slice(5),0)).getUTCDate();return `<section><h2>Agenda</h2><input type="month" value="${month}" onchange="month=this.value;selected=month+'-01';render()"><div class="calendar">${days.map(x=>`<small>${x.slice(0,3)}</small>`).join('')}${'<span></span>'.repeat(dayIndex(first))}${Array.from({length:n},(_,i)=>{let k=month+'-'+String(i+1).padStart(2,'0');return `<button title="${esc(holiday(k)||status(k))}" style="color:${sc[statuses.indexOf(status(k))]}" class="${k===selected?'active':''}" onclick="datePick('${k}')">${i+1}${status(k)==='Travail'&&(entry(k).am||entry(k).pm)?'<span style="color:#c084fc">•</span>':''}${data.events.some(e=>eventDates(e,k))?'★':''}</button>`}).join('')}</div></section>${dateUI()}<section><h2>${selected} ${esc(holiday(selected))}</h2><label>Statut</label><select onchange="setEntry(selected,'status',this.value)">${statuses.map(x=>`<option ${x===status(selected)?'selected':''}>${x}</option>`).join('')}</select><label><input type="checkbox" ${entry(selected).am?'checked':''} ${status(selected)!=='Travail'?'disabled':''} onchange="setEntry(selected,'am',this.checked)"> Plage fixe 10h–11h30</label><label><input type="checkbox" ${entry(selected).pm?'checked':''} ${status(selected)!=='Travail'?'disabled':''} onchange="setEntry(selected,'pm',this.checked)"> Plage fixe 14h30–15h30</label><button onclick="eventEdit()">＋ RDV / anniversaire</button>${eventList(selected)}</section>${cycleUI()}${modelsUI()}${tasksUI()}`}
function statsUI(){let start=period==='year'?selected.slice(0,4)+'-01-01':period==='month'?selected.slice(0,7)+'-01':monday(selected),end=period==='year'?selected.slice(0,4)+'-12-31':period==='month'?iso(new Date(Date.UTC(+selected.slice(0,4),+selected.slice(5,7),0))):shift(start,6), counts={},future={};for(let k=start;k<=end;k=shift(k,1)){let o=k<dateStr()?counts:future;let st=status(k);o[st]=(o[st]||0)+1;o['Plages fixes']=(o['Plages fixes']||0)+Number(!!entry(k).am)+Number(!!entry(k).pm)}return `${dateUI()}<section><h2>Statistiques professionnelles</h2><div class="row">${[['week','Semaine'],['month','Mois'],['year','Année']].map(([v,n])=>`<button class="${period===v?'active':''}" onclick="period='${v}';render()">${n}</button>`).join('')}</div>${period==='year'?`<label>Année <input type="number" min="1900" max="2200" value="${selected.slice(0,4)}" onchange="if(this.value>=1900&&this.value<=2200)datePick(this.value+'-01-01')"></label>`:''}<p>Journées terminées / à venir (estimations modifiables dans l’agenda)</p><div class="statsgrid">${[...statuses,'Plages fixes'].map(k=>`<div class="tile" style="border-left:3px solid ${styles22[k][1]}"><small style="color:${styles22[k][1]}">${styles22[k][0]} ${k}</small><div class="stat">${counts[k]||0}</div><small>${future[k]||0} à venir</small></div>`).join('')}</div></section>`}
function weekUI(){let m=monday(selected);return `${dateUI()}${cycleUI()}<section><div class="row"><button class="${!detailed?'active':''}" onclick="detailed=false;render()">Synthétique</button><button class="${detailed?'active':''}" onclick="detailed=true;render()">Détaillé</button><button onclick="go(5)">Semaines types</button></div>${!detailed?Object.keys(cats).map((k,i)=>`<label class="filter"><input type="checkbox" ${!data.filters||data.filters.includes(k)?'checked':''} onchange="filterChange(${i},this.checked)">${ico(k)} ${cname(k)}</label>`).join(''):''}</section>${days.map((n,i)=>{let k=shift(m,i);return `<section><h2>${n} ${k.slice(-2)} · ${esc(status(k))}</h2><small>${esc(holiday(k))}</small>${detailed?realLines(k):sorted(plan(k)).filter(x=>!data.filters||data.filters.includes(x.c)).map(x=>`<span class="chip" style="--c:${cats[x.c]||'#aab6ca'}">${ico(x.c)} ${esc(x.n)}</span>`).join('')}${eventList(k)}<button onclick="selected='${k}';go(0)">Ouvrir</button></section>`}).join('')}`}
function filterChange(i,v){let k=Object.keys(cats)[i];data.filters=data.filters||Object.keys(cats);data.filters=v?[...new Set([...data.filters,k])]:data.filters.filter(x=>x!==k);save();render()}
function nav21(){ $('nav').innerHTML=['⌂|Accueil','▦|Planning','📅|Agenda','▥|Stats','⚙|Réglages'].map((x,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})"><span>${x.split('|')[0]}</span>${x.split('|')[1]}</button>`).join('')}
render=function(){if(tab===5){tab=2;oldRender();tab=5;$('app').insertAdjacentHTML('afterbegin','<button onclick="go(1)">‹ Planning réel</button>');nav21();return}if(tab===4){oldRender();let sections=$('app').querySelectorAll('section');if(sections[1])sections[1].innerHTML='<h2>Cycle</h2><p>Réglage depuis le planning ou l’agenda. Ancien compteur horaire conservé dans la sauvegarde, mais masqué.</p>';$('app').insertAdjacentHTML('beforeend',notificationUI());nav21();return}let h='<small class="eyebrow">TON ESPACE PERSONNEL · V2.2</small><h1>Mon quotidien</h1>';if(tab===0){let arr=plan(selected),now=new Date(),mi=now.getHours()*60+now.getMinutes(),x=selected===dateStr()?sorted(arr).find(x=>mins(x.e)>mi):null;h+=dateUI()+`<p>${days[dayIndex(selected)]} · Semaine ${cycle(selected)?'B':'A'} · ${esc(status(selected))} ${esc(holiday(selected))}</p>${x?`<section class="hero"><small>${mins(x.s)<=mi?'EN COURS':'À SUIVRE'}</small><h2>${ico(x.c)} ${esc(x.n)}</h2>${esc(x.s)} – ${esc(x.e)}</section>`:''}<section><h2>Programme du jour</h2>${realLines(selected)}${eventList(selected)}<div class="row"><button onclick="realEdit(-1)">＋ Activité</button><button onclick="eventEdit()">＋ RDV</button><button onclick="go(2)">Agenda</button></div>${entry(selected).plan?'<button onclick="if(confirm(\'Revenir au modèle de base ?\')){delete data.agenda[selected].plan;save();render()}">Rétablir le modèle</button>':''}</section>`+recap()+tasksUI()}if(tab===1)h+=weekUI();if(tab===2)h+=agendaUI();if(tab===3)h+=statsUI();$('app').innerHTML=h;nav21()};
// Keep template editor active when selecting its days.
choose=function(W,D){w=W;d=D;render()};go=function(t){tab=t;render()};
const notifyTypes22={activity:'Activités',rdv:'Rendez-vous',birthday:'Anniversaires',task:'Tâches',fixed:'Plages fixes',leave:'Congés et RTT',holiday:'Jours fériés',weekly:'Récapitulatif hebdomadaire'};
function notificationUI(){return `<section><h2>🔔 Notifications et rappels</h2><p>Autorisation : ${typeof Notification==='undefined'?'Non disponible':Notification.permission}</p><button onclick="enable22()">Activer les notifications</button> <button onclick="test22()">Notification de test</button><p>Rappels lorsque la page reste ouverte. Son et vibration selon le système. Aucun rappel garanti page fermée.</p>${Object.entries(notifyTypes22).map(([k,n])=>`<label><input type="checkbox" ${data.notify22?.[k]!==false?'checked':''} onchange="(data.notify22??={})['${k}']=this.checked;save()"> ${n}</label>`).join('')}</section>`}
async function enable22(){if(typeof Notification==='undefined')return alert('Notifications indisponibles');await Notification.requestPermission();render()}
async function send22(title,body){if(typeof Notification==='undefined'||Notification.permission!=='granted')return false;try{let reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.showNotification(title,{body,icon:'./icon-192.png'});else new Notification(title,{body});return true}catch(e){return false}}
async function test22(){if(!await send22('Mon quotidien','Notification de test'))alert('Notification impossible : vérifie les autorisations du navigateur et du système.')}
let checking22=false;
async function check22(){if(checking22)return;checking22=true;try{let now=new Date(),today=dateStr(),items=[];let add=(type,k,name,time,rem)=>{if(data.notify22?.[type]===false||rem==null||rem==='none')return;let due=new Date(k+'T'+(time||'09:00')+':00').getTime()-Number(rem)*60000;if(now-due>=0&&now-due<120000)items.push({id:JSON.stringify([type,k,name,time,rem]),name,type})};for(let k=today;k<=shift(today,14);k=shift(k,1)){for(let ev of data.events)if(eventDates(ev,k))add(ev.kind,k,ev.name,ev.start,ev.reminder);for(let a of plan(k))add('activity',k,a.n,a.s,a.reminder);if(status(k)==='Travail'){if(entry(k).am)add('fixed',k,'Plage fixe – Matin','10:00','15');if(entry(k).pm)add('fixed',k,'Plage fixe – Après-midi','14:30','15')}if(['Congé','RTT','Férié'].includes(status(k)))add(status(k)==='Férié'?'holiday':'leave',k,holiday(k)||status(k),'09:00','1440')}for(let t of data.tasks)if(!t.done&&t.date)add('task',t.date,t.name,'09:00',t.reminder);if(dayIndex(today)===0)add('weekly',today,'Consulte ton planning de la semaine','09:00','0');data.sent22??={};for(let [id,ts] of Object.entries(data.sent22))if(now-ts>172800000)delete data.sent22[id];for(let x of items)if(!data.sent22[x.id]&&await send22('Mon quotidien',x.name)){data.sent22[x.id]=Date.now();save()}}finally{checking22=false}}
setInterval(check22,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check22()});
save();render();setInterval(()=>{if(tab===0&&!$('modal').open)render()},60000);if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
